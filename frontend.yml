- name: Frontend
  hosts: all
  become: yes
  tasks:
    - name: Install Nginx RPM package from a remote URL
      ansible.builtin.dnf:
        name: nginx
        state: installed

    - name: Copying nginx configuration
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: Configuring NodeJS repo
      ansible.builtin.shell: curl -sL https://rpm.nodesource.com/setup_20.x | bash

    - name: Installing Node.js
      ansible.builtin.dnf:
        name: nodejs
        state: installed

    - name: Delete an existing tmp directory
      ansible.builtin.file:
        path: /tmp/frontend
        state: absent

    - name: Create a temp folder for downloading the app code
      ansible.builtin.file:
        path: /tmp/frontend
        state: directory

    - name: Download and extract frontend code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/frontend.zip
        dest: /tmp/frontend
        remote_src: true

    - name: Compiling Frontend code
      ansible.builtin.shell: |
        npm install
        npm run build

    - name: Delete default http content
      ansible.builtin.file:
        path: /usr/share/nginx/html/
        state: absent

    - name: Create a temp folder for downloading the app code
      ansible.builtin.file:
        path: /usr/share/nginx/html/
        state: directory

    - name: Copying compiled code to nginx
      ansible.builtin.copy:
        src: tmp/frontend/out/
        dest: /usr/share/nginx/html/
        remote_src: true

    - name: Start and enable Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true



